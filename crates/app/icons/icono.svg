<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb39f"/>
      <stop offset="0.55" stop-color="#0b6b62"/>
      <stop offset="1" stop-color="#074640"/>
    </linearGradient>
    <radialGradient id="calido" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#f2bf6b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2bf6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#032b27" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Base: cuadrado de esquinas continuas -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#fondo)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#calido)"/>
  <!-- Tarjeta de vidrio flotante con barras de un tablero -->
  <g filter="url(#sombra)">
    <rect x="212" y="300" width="600" height="440" rx="72" fill="url(#vidrio)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>
    <rect x="292" y="560" width="76" height="110" rx="20" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="404" y="500" width="76" height="170" rx="20" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="516" y="440" width="76" height="230" rx="20" fill="#ffffff" fill-opacity="0.92"/>
    <!-- Moneda -->
    <circle cx="680" cy="420" r="118" fill="#f6c768"/>
    <circle cx="680" cy="420" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="10"/>
    <path d="M680 352v136M716 382c-6-16-22-26-40-26c-22 0-38 13-38 31c0 42 82 22 82 64c0 19-17 33-42 33c-21 0-38-11-44-29"
          fill="none" stroke="#7a4b00" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Brillo especular superior -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#brillo)"/>
  <rect x="67" y="67" width="890" height="890" rx="217" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
</svg>
