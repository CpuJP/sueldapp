<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sueldapp</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="tablero.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="fondo" aria-hidden="true">
    <span class="mancha m1"></span><span class="mancha m2"></span>
    <span class="mancha m3"></span><span class="mancha m4"></span>
  </div>
  <a class="saltar" href="#principal">Saltar al contenido</a>

  <div class="marco">
    <nav class="lateral vidrio" aria-label="Secciones">
      <div class="marca">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" class="marca-fondo"/><rect x="6" y="18" width="3.4" height="6" rx="1" fill="currentColor"/><rect x="11" y="15" width="3.4" height="9" rx="1" fill="currentColor"/><rect x="16" y="12" width="3.4" height="12" rx="1" fill="currentColor"/><circle cx="23" cy="10" r="5" class="marca-moneda"/></svg>
        <span>Sueldapp</span>
      </div>
      <ul class="menu">
        <li><a href="#tablero" data-vista="tablero"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 15l4-5 3 3 5-7"/></svg><span>Tablero</span><kbd>Alt 1</kbd></a></li>
        <li><a href="#resumen" data-vista="resumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg><span>Resumen</span><kbd>Alt 2</kbd></a></li>
        <li><a href="#movimientos" data-vista="movimientos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Movimientos</span><kbd>Alt 3</kbd></a></li>
        <li><a href="#deudas" data-vista="deudas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M6 18V9m4 9V6m4 12v-7m4 7V4"/></svg><span>Deudas</span><kbd>Alt 4</kbd></a></li>
        <li><a href="#tarjetas" data-vista="tarjetas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M3 10h18M7 15h4"/></svg><span>Tarjetas</span><kbd>Alt 5</kbd></a></li>
        <li><a href="#catalogos" data-vista="catalogos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h6v6H5zM13 5h6v6h-6zM5 13h6v6H5zM13 16h6"/></svg><span>Catálogos</span><kbd>Alt 6</kbd></a></li>
        <li><a href="#datos" data-vista="datos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span>Importar y exportar</span><kbd>Alt 7</kbd></a></li>
        <li><a href="#ajustes" data-vista="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/></svg><span>Ajustes</span><kbd>Alt 8</kbd></a></li>
      </ul>
      <p class="demo-aviso" id="demo-aviso" hidden>Datos de demostración</p>
    </nav>

    <main id="principal" tabindex="-1">
      <header class="barra vidrio">
        <h1 id="titulo">Tablero</h1>
        <div class="barra-acciones" id="barra-acciones"></div>
      </header>
      <div id="vista" class="vista"></div>
    </main>
  </div>

  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <dialog id="dialogo" class="dialogo vidrio-fuerte" aria-labelledby="dialogo-titulo"></dialog>
</body>
</html>
