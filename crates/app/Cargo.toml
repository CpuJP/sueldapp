[package]
name = "sueldapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sueldapp-almacen = { version = "0.2.0", path = "../almacen" }
sueldapp-dominio = { version = "0.2.0", path = "../dominio" }
sueldapp-ods = { version = "0.2.0", path = "../ods" }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
rfd = "0.17"
png = "0.18"
rust_decimal = "1.43.0"

[lints]
workspace = true

[build-dependencies]
slint-build = "1.18.1"

# Instaladores con `cargo packager --release` (deb, AppImage, NSIS, MSI) y
# `cargo generate-rpm` (rpm). Ver docs/RELEASES.md.
[package.metadata.packager]
product-name = "Sueldapp"
identifier = "co.sueldapp.escritorio"
description = "Finanzas personales locales: sueldo, gastos, deudas y tarjetas."
long-description = "Sueldapp reemplaza una hoja de cálculo de finanzas personales: importa los datos con conciliación exacta, muestra un tablero de estadísticas y gestiona gastos, ingresos, deudas a cuotas y tarjetas de crédito. Todo se guarda localmente; la app no usa la red."
authors = ["Juan Pablo Giraldo Collazos"]
publisher = "Juan Pablo Giraldo Collazos"
homepage = "https://github.com/CpuJP/sueldapp"
license-file = "../../LICENSE"
category = "Finance"
copyright = "© 2026 Juan Pablo Giraldo Collazos. Licencia MIT."
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.png", "icons/icon.ico"]
out-dir = "../../target/paquetes"
binaries = [{ path = "sueldapp", main = true }]

[package.metadata.packager.deb]
depends = ["libfontconfig1", "libxkbcommon0", "libxkbcommon-x11-0", "libegl1", "libwayland-client0"]
section = "utils"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
languages = ["Spanish", "English"]

[package.metadata.packager.wix]
languages = ["es-ES"]

[package.metadata.generate-rpm]
name = "sueldapp"
summary = "Finanzas personales locales: sueldo, gastos, deudas y tarjetas."
license = "MIT"
assets = [
    { source = "../../target/release/sueldapp", dest = "/usr/bin/sueldapp", mode = "755" },
    { source = "sueldapp.desktop", dest = "/usr/share/applications/sueldapp.desktop", mode = "644" },
    { source = "icons/128x128@2x.png", dest = "/usr/share/icons/hicolor/256x256/apps/sueldapp.png", mode = "644" },
    { source = "icons/icono.svg", dest = "/usr/share/icons/hicolor/scalable/apps/sueldapp.svg", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/sueldapp/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
mesa-libEGL = "*"
libwayland-client = "*"
