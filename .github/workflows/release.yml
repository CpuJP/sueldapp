name: Release

# Al empujar una etiqueta vX.Y.Z (o vX.Y.Z-alpha.N): comprueba, construye y publica sola.
# Si falla cualquier prueba o plataforma, la release se queda en borrador.
# La versión de [workspace.package] en Cargo.toml debe coincidir con X.Y.Z.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta existente a construir (p. ej. v0.1.0-alpha.1)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preparar:
    name: Preparar release
    runs-on: ubuntu-24.04
    outputs:
      etiqueta: ${{ steps.v.outputs.etiqueta }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.etiqueta || github.ref }}
      - id: v
        name: Comprobar versión
        shell: bash
        run: |
          etiqueta="${{ github.event.inputs.etiqueta || github.ref_name }}"
          version="${etiqueta#v}"
          base="${version%%-*}"
          app=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$app" != "$base" ]; then
            echo "::error::La etiqueta $etiqueta no coincide con la versión $app de Cargo.toml"
            exit 1
          fi
          if ! grep -q "^## \[$base\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene la sección de la versión $base"
            exit 1
          fi
          funcion="v${base//./_}"
          if ! grep -Eq "fn ${funcion}(_|\()" crates/almacen/tests/versiones.rs; then
            echo "::error::Falta una prueba ${funcion}_… en crates/almacen/tests/versiones.rs"
            exit 1
          fi
          echo "etiqueta=$etiqueta" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$base" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Crear borrador de release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ steps.v.outputs.etiqueta }}"; version="${version#v}"
          notas=$(awk -v v="## [$version]" 'index($0, v) == 1 {d=1; next} /^## \[/ {d=0} d' CHANGELOG.md)
          flag=""
          if [ "${{ steps.v.outputs.prerelease }}" = "true" ]; then flag="--prerelease"; fi
          gh release view "${{ steps.v.outputs.etiqueta }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.v.outputs.etiqueta }}" --draft $flag \
              --title "Sueldapp ${{ steps.v.outputs.etiqueta }}" --notes "${notas:-Ver CHANGELOG.md}"

  comprobar:
    name: Comprobaciones
    needs: preparar
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.preparar.outputs.etiqueta }}

  construir:
    name: ${{ matrix.nombre }}
    needs: [preparar, comprobar]
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Linux x64
            os: ubuntu-22.04
            paquetes: deb,appimage
          - nombre: Linux ARM64
            os: ubuntu-22.04-arm
            paquetes: deb
          - nombre: Windows x64
            os: windows-latest
            paquetes: nsis,wix
          - nombre: Windows ARM64
            os: windows-11-arm
            paquetes: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preparar.outputs.etiqueta }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de sistema (fuentes y teclado)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev file
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager,cargo-generate-rpm
      - name: Construir instaladores
        shell: bash
        # NO_STRIP: el strip de linuxdeploy no entiende algunas bibliotecas recientes.
        env:
          NO_STRIP: "true"
        run: cargo packager --release -p sueldapp -f ${{ matrix.paquetes }}
      - name: Construir rpm
        if: runner.os == 'Linux'
        run: cargo generate-rpm -p crates/app
      - name: Reunir instaladores
        shell: bash
        run: |
          mkdir -p dist
          find target/paquetes target/generate-rpm -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: sueldapp-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: [preparar, construir]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256 y subida
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ needs.preparar.outputs.etiqueta }}" * --clobber
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flag="--latest"
          if [ "${{ needs.preparar.outputs.prerelease }}" = "true" ]; then flag="--prerelease"; fi
          gh release edit "${{ needs.preparar.outputs.etiqueta }}" --draft=false $flag
