name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # La conciliación contra la hoja real necesita datos privados que no están en el repositorio.
  SUELDAPP_SIN_ODS: "1"

jobs:
  formato:
    name: Formato y lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Dependencias de sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  pruebas:
    name: Pruebas (${{ matrix.nombre }})
    needs: formato
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Linux x64
            os: ubuntu-24.04
          - nombre: Linux ARM64
            os: ubuntu-24.04-arm
          - nombre: Windows x64
            os: windows-latest
          - nombre: Windows ARM64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de sistema (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Pruebas
        run: cargo test --workspace --locked
      - name: Compilar la app
        run: cargo build -p sueldapp --release --locked
