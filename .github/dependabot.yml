version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri*", "wry", "tao"]
    ignore:
      # Deben seguir la versión de gtk-rs que usa Tauri (función opcional `capturas`).
      - dependency-name: "cairo-rs"
      - dependency-name: "webkit2gtk"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
